name: Release

# Builds the binaries for a version tag, attests their provenance, and publishes a GitHub release.
# Releases are immutable in this organization, so a published binary can never be replaced.
on:
  push:
    tags: ["v*"]
  # Builds and checks the binaries on changes to the release files, without publishing.
  pull_request:
    paths: [".github/workflows/release.yml", "install.sh", "package.json", "bun.lock"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macOS, so the darwin binaries can be signed (ad hoc) and run here before release.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Check the tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/cli.ts)"
          package="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",$/\1/p' package.json)"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match src/cli.ts $version"; exit 1; }
          test "$version" = "$package" || { echo "package.json $package does not match src/cli.ts $version"; exit 1; }
      - name: Build
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            suffix=""
            if [ "$target" = "windows-x64" ]; then suffix=".exe"; fi
            bun build src/main.ts --compile --minify --target="bun-$target" --outfile "release/betteroff-$target$suffix"
          done
          codesign --force --sign - release/betteroff-darwin-arm64 release/betteroff-darwin-x64
          ./release/betteroff-darwin-arm64 --version
          (cd release && shasum -a 256 betteroff-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  check-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: |
          cd release && sha256sum --check SHA256SUMS
          chmod +x betteroff-linux-x64 && ./betteroff-linux-x64 --version

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, check-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      # Signed SLSA provenance tying each binary to this workflow run and commit.
      # Verify with: gh attestation verify <file> --repo raintree-technology/betteroff.cli
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/betteroff-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --title "BetterOff CLI $TAG" --notes-file - <<NOTES
          Read-only BetterOff CLI. Install on macOS or Linux:

              curl -fsSL https://raw.githubusercontent.com/$REPO/$TAG/install.sh | sh

          The script checks each download against SHA256SUMS, and against its build provenance when the GitHub CLI is installed. To check a binary yourself:

              gh attestation verify betteroff-darwin-arm64 --repo $REPO

          On Windows, download betteroff-windows-x64.exe and check it against SHA256SUMS.
          NOTES
